# pibackup_python – Python-Projektdefinition.
#
# Projekt:     pibackup_python
# Modul:       pyproject.toml
# Version:     1.0.0
# Stand:       2026-08-24
# Abhaengig:   Debian-Pakete e2fsprogs, util-linux, zstd, mount; Python-Standardbibliothek (Python >= 3.10)
# Bezug:       requirements.txt (leer – Stdlib only; Linux-Werkzeuge siehe Datei)
# Lizenz:      MIT
# Upstream:    https://github.com/RaspberryFpc/pibackup (RaspberryFpc)
# Erstellt mit: Cursor Grok 4.6
# Autor:       (FFHB) / RadioBBS
#
# Historie
# --------
# Version 1.0.0 – 2026-08-24 – PEP-621-Metadaten.
#
#   python -m pip install -r requirements.txt

[project]
name = "pibackup-python"
version = "1.0.0"
description = "Python-CLI und Browser-GUI fuer Raspberry-Pi-Backup, Restore und Klonen (Startpartition plus Root, Verkleinern, zstd)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "(FFHB) / RadioBBS" }]
keywords = ["raspberry-pi", "backup", "restore", "clone", "zstd", "img"]
dependencies = []

[project.urls]
Homepage = "https://github.com/RadioBBS/pibackup_python"
Repository = "https://github.com/RadioBBS/pibackup_python"
Upstream = "https://github.com/RaspberryFpc/pibackup"

[project.scripts]
pibackup-python = "pibackup_python:main"
pibackup-python-gui = "pibackup_python_gui:main"
