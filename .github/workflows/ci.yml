# pibackup_python – GitHub-Actions: Unittests ohne Blockgeraete.
#
# Projekt:     pibackup_python
# Modul:       .github/workflows/ci.yml
# Version:     1.0.0
# Stand:       2026-08-24
# Abhaengig:   Debian-Pakete e2fsprogs, util-linux, zstd, mount; Python-Standardbibliothek (Python >= 3.10)
# Bezug:       requirements.txt (leer – Stdlib only; Linux-Werkzeuge siehe Datei)
# Lizenz:      MIT
# Upstream:    https://github.com/RaspberryFpc/pibackup (RaspberryFpc)
# Erstellt mit: Cursor Grok 4.6
# Autor:       (FFHB) / RadioBBS
#
# Historie
# --------
# Version 1.0.0 – 2026-08-24 – CI fuer unittest.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Unittests
        run: python -m unittest tests.test_pibackup_python
