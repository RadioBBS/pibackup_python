name: pibackup_python
description: Python-CLI und Browser-GUI fuer Raspberry-Pi-Backup, Restore und Klonen (Startpartition plus Root, Verkleinern, zstd).
language: python
python_min: "3.10"
license: MIT
version: "1.0.0"
stand: "2026-08-24"
author: (FFHB) / RadioBBS
upstream: https://github.com/RaspberryFpc/pibackup
scripts:
  - pibackup_python.py
  - pibackup_python_gui.py
  - project_meta.py
repository:
  host: github
  owner: RadioBBS
  name: pibackup_python
  url: https://github.com/RadioBBS/pibackup_python
  visibility: public
  default_branch: main
standards:
  styleguide: "1.7.0"
  styleguide_file: "%USERPROFILE%\\Documents\\Cursor\\.Security-and-Styleguide\\0-Style‑Guide.txt"
  software_standard: "1.2.0"
  software_standard_file: "%USERPROFILE%\\Documents\\Cursor\\.Security-and-Styleguide\\MY-SOFTWARE-STANDARD v1.0.0.txt"
testing:
  framework: unittest
  command: python -m unittest tests.test_pibackup_python
  required: true
  live_block_devices: false
cli:
  help: [--help, -h]
  version: [--version]
  wait_at_end: [--Ende, -E]
maintenance:
  status: active
  owner: RadioBBS
documentation:
  language: de
security:
  secrets_in_repo: false
  scans_dot_directories: false
  gui_bind: 127.0.0.1
machine_readable:
  - PROJECT.yaml
  - pyproject.toml
  - CITATION.cff
  - .github/workflows/ci.yml
